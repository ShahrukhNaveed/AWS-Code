<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS-Code on AKS</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f1f5f9;
    }
    .card {
      text-align: center;
      padding: 48px 56px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }
    p {
      margin: 4px 0;
      color: #94a3b8;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 16px;
      border-radius: 999px;
      background: #22c55e22;
      color: #4ade80;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Deployed via GitHub Actions → AKS</h1>
    <p>Repo: ShahrukhNaveed / AWS-Code</p>
    <p>Cluster: test-terraform</p>
    <span class="badge">LIVE ON KUBERNETES</span>
  </div>
</body>
</html>
