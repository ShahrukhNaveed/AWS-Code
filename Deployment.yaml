apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-code-deployment
  labels:
    app: aws-code
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aws-code
  template:
    metadata:
      labels:
        app: aws-code
    spec:
      containers:
        - name: aws-code-container
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
 
